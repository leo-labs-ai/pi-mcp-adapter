name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
        working-directory: examples/interactive-visualizer
      - run: npm run build
        working-directory: examples/interactive-visualizer
      - run: npm test
      - run: npm run test:oauth-provider
